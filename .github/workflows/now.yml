name: ME TV Scraper Suite

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 9 * * *' # Her gün Türkiye saatiyle 12:00 civarı çalışır

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repo'yu checkout et
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri yükle
        run: |
          pip install requests beautifulsoup4 cloudscraper

      - name: Kanal D Tarayıcıyı Çalıştır
        run: python kanald.py
        continue-on-error: true # Biri hata verirse diğerine geçsin

      - name: Now TV Tarayıcıyı Çalıştır
        run: python nowtv.py
        continue-on-error: true

      - name: Show TV Tarayıcıyı Çalıştır (Varsa)
        run: python showtv.py
        continue-on-error: true

      - name: Değişiklikleri Repoya Yükle
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Oluşan tüm HTML dosyalarını ekle
          git add *.html
          
          # Değişiklik var mı kontrol et ve pushla
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "🔄 VOD Arşivi Güncellendi: $(date +'%Y-%m-%d %H:%M')"
            git push
            print "✅ Tüm dosyalar başarıyla güncellendi."
          else
            echo "ℹ️ Hiçbir değişiklik bulunamadı, push yapılmadı."
          fi
