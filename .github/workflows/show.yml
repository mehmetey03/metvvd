name: ShowTV VOD Scraper

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repo'yu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tüm geçmişi al (rebase için gerekli)

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Python Kütüphanelerini Kur
        run: |
          pip install requests beautifulsoup4 lxml unidecode tqdm urllib3

      - name: Scraper'ı Çalıştır
        run: |
          python show.py

      - name: Git yapılandırması
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "GitHub Actions"

      - name: HTML Çıktısını Commit Et ve Push Et
        run: |
          git add showtv.html
          
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "ShowTV güncellendi [$(date +'%Y-%m-%d %H:%M:%S')]"
            
            # Remote'ta yeni commit varsa önce rebase ile al
            git pull --rebase origin main
            
            # Push et
            git push origin main
          else
            echo "Değişiklik yok, commit atlanıyor."
          fi
